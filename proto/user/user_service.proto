syntax = "proto3";

package user.v1;

option go_package = "grpc-exchange/gen/user;userv1";

service UserService{
  rpc GetUser(GetUserRequest) returns (User);
  rpc CheckUserRoles(CheckUserRolesRequest) returns (CheckUserRolesResponse);
}

message User {
  string user_id = 1;
  string username = 2;
  string email = 3;
  repeated string roles = 4; // Роли пользователя
  bool active = 5;
}

message GetUserRequest {
  string user_id = 1;
}

message CheckUserRolesRequest {
  string user_id = 1;
  repeated string required_roles = 2;
}

message CheckUserRolesResponse {
  bool has_access = 1;
  repeated string user_roles = 2;
}