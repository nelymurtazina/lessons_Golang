syntax = "proto3";

package order.v1;

option go_package = "grpc-exchange/gen/order;orderv1";

import "common/money.proto";
import "common/decimal.proto";
import "google/protobuf/timestamp.proto";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrderStatus(GetOrderStatusRequest) returns (GetOrderStatusResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;   // Покупка
  ORDER_SIDE_SELL = 2;  // Продажа
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;   // Лимитная заявка (по конкретной цене)
  ORDER_TYPE_MARKET = 2;  // Рыночная (по лучшей цене)
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;          // В обработке
  ORDER_STATUS_FILLED = 2;           // Исполнена полностью
  ORDER_STATUS_PARTIALLY_FILLED = 3; // Частично исполнена
  ORDER_STATUS_CANCELLED = 4;        // Отменена
  ORDER_STATUS_REJECTED = 5;         // Отклонена
}


message Order {
  string order_id = 1; // order_id
  string user_id = 2;
  string market_id = 3;

  OrderSide side = 4; // order_side -покупаем, продаем 
  OrderType type = 5; // проблемы с конвертацией. специальная библиотека для работы с деньгами. money!!!!
  
  common.v1.Money price = 6;    
  common.v1.Decimal quantity = 7; //Кол-во decemel 
  common.v1.Decimal filled_quantity = 8; // Сколько уже исполнено
  OrderStatus status = 9; 
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreateOrderRequest {
  string user_id = 1; //нельзя так делать. рп НО В задании так требуется! ЧТО ДЕЛАТЬ?
  string market_id = 2;
  OrderSide side = 3;
  OrderType type = 4;
  common.v1.Money price = 5;
  common.v1.Decimal quantity = 6; 
}

//

message CreateOrderResponse{
  string order_id = 1;
  OrderStatus status = 2;
}

message GetOrderStatusRequest {
  string order_id = 1;
  string user_id = 2;
}

message GetOrderStatusResponse{
  Order order = 1; 
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id = 2; // Для проверки прав доступа
}

message CancelOrderResponse {
  string order_id = 1;
  OrderStatus status = 2;
  string message = 3;
}